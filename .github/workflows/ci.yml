name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  pages: write
  id-token: write

jobs:
  # ---------------------------------------------------------------------------
  # Build & push the devcontainer image so the other jobs run in the exact same
  # environment as local development.
  # ---------------------------------------------------------------------------
  image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.vars.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name (must be lowercase for GHCR)
        id: vars
        run: echo "image=ghcr.io/${REPO,,}/ci:latest" >> "$GITHUB_OUTPUT"
        env:
          REPO: ${{ github.repository }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push CI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          push: true
          tags: ${{ steps.vars.outputs.image }}

  # ---------------------------------------------------------------------------
  # Build the native Linux target and run the GTest unit tests.
  # ---------------------------------------------------------------------------
  test:
    needs: image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.image }}
      # Run as root: avoids permission issues with the checkout (the image
      # otherwise switches to the unprivileged `dev` user).
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory '*'

      - name: Configure
        run: cmake --preset tests

      - name: Build
        run: cmake --build --preset tests

      - name: Run unit tests
        run: ctest --preset tests

  # ---------------------------------------------------------------------------
  # Generate the Doxygen documentation and publish it to GitHub Pages (main only).
  # ---------------------------------------------------------------------------
  docs:
    needs: image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.image }}
      options: --user root
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory '*'

      - name: Configure
        run: cmake --preset linux_preset

      - name: Generate Doxygen
        run: cmake --build build/linux_preset --target doxygen

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/linux_preset/docs/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
